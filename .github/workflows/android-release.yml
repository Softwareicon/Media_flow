name: Build & Release APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-release.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: mobile } }
    env:
      # Set a repo variable API_URL (Settings > Secrets and variables > Actions > Variables) to your live HTTPS backend
      EXPO_PUBLIC_API_URL: ${{ vars.API_URL || 'https://api.example.com' }}
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      - run: npx expo prebuild --platform android --clean --no-install
      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Collect APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          mkdir -p ../dist
          cp android/app/build/outputs/apk/release/app-release.apk "../dist/MediaFlowPro-${TAG}.apk"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: MediaFlow Pro ${{ steps.apk.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            Android APK (release build, sideload install).
            API URL baked in: ${{ env.EXPO_PUBLIC_API_URL }}
          files: dist/*.apk
